[build-system]
requires = [
    "setuptools",
    "Cython",
    "numpy"
]
build-backend = "setuptools.build_meta"

[project]
name = "magrathea"
version = "0.1.0"
description = "A Python project template for the magrathea repository."
authors = [
    { name = "kwan3217", email = "kwan3217@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "spiceypy",
    "matplotlib",
    "pytest",
    "kwanmath @ git+https://github.com/kwan3217/kwanmath.git",
    "Cython",
    "numpy",
    "jupyterlab"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
magrathea = ["*.h", "*.pyx"]

[tool.cython]
language_level = 3
