[build-system]
requires = [
    "setuptools>=61.0",
    "Cython>=0.29.36",
    "numpy>=1.23.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "magrathea"
version = "0.1.0"
description = "A Python project template for the magrathea repository."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "spiceypy",
    "matplotlib",
    "pytest",
    "kwanmath @ git+ssh://git@github.com/kwan3217/kwanmath.git",
    "Cython>=0.29.36",
    "numpy>=1.23.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
magrathea = ["*.h", "*.pyx"]

[tool.cython]
language_level = 3
